name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install raylib dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev xvfb
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
      - name: C++ unit tests
        working-directory: build
        run: |
          set -o pipefail
          ./Tetris --test | tee test.log
          if grep -q FAILED test.log; then exit 1; fi
          # the original tests only print on success, so also count them
          test "$(grep -c "passed!" test.log)" -ge 88
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python tests (gesture detector and camera script)
        run: python -m unittest gesture/test_gestures.py gesture/test_hand_control.py
      - name: Smoke test (plays the real game headless)
        run: xvfb-run -a -s "-screen 0 1024x768x24" python tests/smoke_test.py build/Tetris

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build
        run: |
          cmake -B build -A x64
          cmake --build build --config Release
      - name: C++ unit tests
        shell: pwsh
        run: |
          $out = & build/Release/Tetris.exe --test
          $code = $LASTEXITCODE
          $out
          if ($code -ne 0 -or ($out | Select-String -SimpleMatch "FAILED")) { exit 1 }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python tests
        run: python -m unittest gesture/test_gestures.py gesture/test_hand_control.py
      - name: run_windows.bat sets up Python and starts the camera script
        shell: cmd
        run: |
          call gesture\run_windows.bat --help > run_windows.log 2>&1
          type run_windows.log
          findstr /C:"usage: hand_control.py" run_windows.log
      - name: Package
        shell: pwsh
        run: |
          $d = "dist/TetrisPlusPlus"
          New-Item -ItemType Directory -Force $d, "$d/gesture" | Out-Null
          Copy-Item build/Release/Tetris.exe $d
          Copy-Item -Recurse build/Release/assets $d
          Get-ChildItem gesture/*.py -Exclude test_*.py | Copy-Item -Destination "$d/gesture"
          Copy-Item gesture/requirements.txt, gesture/run_windows.bat "$d/gesture"
          Copy-Item packaging/windows/play.bat, packaging/windows/README.txt $d
          Compress-Archive -Path $d -DestinationPath dist/TetrisPlusPlus-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TetrisPlusPlus-windows
          path: dist/TetrisPlusPlus
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TetrisPlusPlus-windows.zip
